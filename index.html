<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .game-card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; width: 150px; }
        button { padding: 10px 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #message { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="game-card">
        <h1>🎯 Guess the Number</h1>
        <p>1 se 100 ke beech ek number guess karo:</p>
        <input type="number" id="userGuess" min="1" max="100" placeholder="Enter number">
        <button onclick="checkGuess()">Guess</button>
        <div id="message"></div>
    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            let guess = parseInt(document.getElementById('userGuess').value);
            let msg = document.getElementById('message');
            attempts++;

            if (!guess) {
                msg.innerText = "Kripya koi number likhein!";
                return;
            }

            if (guess === secretNumber) {
                msg.innerText = `🎉 Mubarak ho! Aapne ${attempts} attempts mein guess kar liya!`;
                msg.style.color = "green";
            } else if (guess > secretNumber) {
                msg.innerText = "📉 Bojot bada number hai! Chota try karo.";
                msg.style.color = "orange";
            } else {
                msg.innerText = "📈 Bohot chota number hai! Bada try karo.";
                msg.style.color = "orange";
            }
        }
    </script>
</body>
</html>
